<!doctype html>
<html lang="rw">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Shakisha filime z'abasobanuzi kuri GAVANA FILMS.">
<title>Ibyamamare | GAVANA FILMS</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#080b10;--panel:#111722;--gold:#d4af37;--gold2:#f0d16e;--muted:#aeb8c9;--line:#3b3320}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#1c1a12 0,#080b10 55%);color:#f6f7fb;font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}a{color:inherit;text-decoration:none}.top{position:sticky;top:0;z-index:5;background:#080b10ed;border-bottom:1px solid #302817;backdrop-filter:blur(14px)}.nav{max-width:1250px;margin:auto;padding:13px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:900;letter-spacing:1px}.logo{background:var(--gold);color:#080808;border-radius:10px;padding:2px 10px;font-size:26px}.brand small{display:block;color:var(--gold2);font-size:10px;letter-spacing:5px;margin-top:-5px}.back{border:1px solid #806b31;color:var(--gold2);border-radius:22px;padding:9px 15px;font-weight:800}.wrap{max-width:1250px;margin:auto;padding:30px 20px 60px}.hero{border:1px solid #5a4924;border-radius:20px;padding:30px;background:linear-gradient(120deg,#211b0d,#111722 65%,#0a0d13);box-shadow:0 18px 55px #0008}.eyebrow{color:var(--gold2);font-weight:900;letter-spacing:4px;font-size:12px}.hero h1{font-size:clamp(30px,5vw,48px);margin:8px 0;color:#fff}.hero p{color:#d4d9e2;margin:0;max-width:700px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:28px 0 15px}.section-head h2{margin:0;border-left:4px solid var(--gold);padding-left:12px;font-size:22px}.search{width:100%;max-width:360px;background:#151d2a;border:1px solid #65552d;color:white;padding:12px 15px;border-radius:25px;outline:none}.names{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:12px}.name{border:1px solid #66552d;border-radius:13px;padding:17px 8px;background:linear-gradient(145deg,#1a1b1b,#111722);color:#f4df9a;font-weight:900;cursor:pointer;min-height:68px;transition:.18s}.name:hover,.name.active{background:linear-gradient(145deg,#d4af37,#987526);color:#090909;transform:translateY(-2px);border-color:#f3d875}.result-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:30px 0 14px}.result-head h2{margin:0;font-size:23px}.count{color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px}.movie{background:var(--panel);border:1px solid #443a23;border-radius:12px;overflow:hidden;min-width:0}.poster{height:230px;background:#202a3a}.poster img{width:100%;height:100%;object-fit:cover}.info{padding:11px}.info h3{font-size:14px;margin:0 0 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.info p{font-size:12px;color:var(--muted);margin:0}.btn{display:block;text-align:center;margin-top:10px;background:var(--gold);color:#080808;padding:8px;border-radius:7px;font-size:12px;font-weight:900}.empty{padding:25px;border:1px dashed #64532b;border-radius:12px;color:var(--muted);text-align:center}.loader{padding:24px;text-align:center;color:var(--gold2)}.footer{text-align:center;border-top:1px solid #292313;color:var(--muted);padding:25px 12px;margin-top:35px}@media(max-width:1000px){.names{grid-template-columns:repeat(4,1fr)}.grid{grid-template-columns:repeat(4,1fr)}}@media(max-width:650px){.wrap{padding:20px 12px 45px}.hero{padding:22px}.names{grid-template-columns:repeat(2,1fr);gap:9px}.name{min-height:58px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.poster{height:225px}.section-head{align-items:flex-start;flex-direction:column}.search{max-width:none}}
</style>
</head>
<body>
<header class="top"><nav class="nav"><a class="brand" href="index.html"><span class="logo">G</span><span>GAVANA<small>F I L M S</small></span></a><a class="back" href="index.html">← Ahabanza</a></nav></header>
<main class="wrap">
<section class="hero"><div class="eyebrow">GAVANA FILMS • INTERPRETERS</div><h1>Ibyamamare</h1><p>Hitamo izina ry'icyamamare urebe filime n'ibindi bikorwa bifitanye isano na ryo biri kuri GAVANA FILMS.</p></section>
<div class="section-head"><h2>Hitamo icyamamare</h2><input id="nameSearch" class="search" placeholder="Shakisha izina..." aria-label="Shakisha izina"></div>
<div class="names" id="names"></div>
<div class="result-head"><h2 id="resultTitle">Filime z'iby'amamare</h2><span class="count" id="count">Tegereza...</span></div>
<div id="results" class="grid"><div class="loader">Gavana Films Loading... Please wait ...</div></div>
</main>
<footer class="footer">© <span id="year"></span> GAVANA FILMS</footer>
<script>
const SUPABASE_URL='https://hiqoqzkbyeewqzrghcfk.supabase.co';
const SUPABASE_KEY='sb_publishable_QsvvsjjhaVRb0X1TbHU9WQ__bI6LX2a';
const names=['ROCKY','GAVANA','SAVIMBI','GAHEZA','SIKOV','SANKALA','Others'];
const terms={ROCKY:['rocky','rocky kimomo'],GAVANA:['gavana','erick gavana'],SAVIMBI:['savimbi','musa savimbi'],GAHEZA:['gaheza','gaheza simba'],SIKOV:['sikov'],SANKALA:['sankala']};
let allMovies=[],selected='';
const $=id=>document.getElementById(id);
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function textOf(v){if(v==null)return '';if(Array.isArray(v))return v.map(textOf).join(' ');if(typeof v==='object')return Object.values(v).map(textOf).join(' ');return String(v);}
function matches(m,name){const t=textOf(m).toLowerCase();if(name==='Others')return !Object.values(terms).flat().some(x=>t.includes(x));return (terms[name]||[]).some(x=>t.includes(x));}
function isSeries(m){return String(m.type||'').toLowerCase()==='series';}
function card(m){const poster=m.poster_path||'';const page=isSeries(m)?'series-download.html':'movie-download.html';return `<article class="movie"><div class="poster">${poster?`<img loading="lazy" src="${esc(poster)}" alt="${esc(m.title)}" onerror="this.style.display='none'">`:''}</div><div class="info"><h3 title="${esc(m.title)}">${esc(m.title)}</h3><p>${esc(m.release_year||'')} · ${isSeries(m)?'Series':'Movie'}</p><p>${esc(m.genre||'')}</p><a class="btn" href="${page}?id=${encodeURIComponent(m.id)}">DOWNLOAD</a></div></article>`;}
function render(){const q=$('nameSearch').value.trim().toLowerCase();const shown=names.filter(n=>n.toLowerCase().includes(q));$('names').innerHTML=shown.map(n=>`<button class="name ${selected===n?'active':''}" data-name="${n}">${n}</button>`).join('');$('names').querySelectorAll('[data-name]').forEach(b=>b.addEventListener('click',()=>{selected=b.dataset.name;render();showMovies();}));}
function showMovies(){const list=selected?allMovies.filter(m=>matches(m,selected)):[];$('resultTitle').textContent=selected==='Others'?'Izindi filime':selected?`Filime za ${selected}`:'Filime z\'ibyammare';$('count').textContent=selected?`${list.length} zibonetse`:'Hitamo izina hejuru';$('results').innerHTML=list.length?list.map(card).join(''):`<div class="empty" style="grid-column:1/-1">${selected?'Nta filime zijyanye n’iri zina zibonetse muri Supabase.':'Hitamo icyamamare kugira ngo ubone filime zacyo.'}</div>`;}
async function load(){try{const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const {data,error}=await db.from('movies').select('*').eq('status','published').order('updated_at',{ascending:false});if(error)throw error;allMovies=data||[];render();showMovies();}catch(e){console.error(e);$('count').textContent='Filime ntizashoboye gupakirwa';$('results').innerHTML='<div class="empty" style="grid-column:1/-1">Ntitwashoboye kubona filime. Ongera ugerageze nyuma.</div>';}}
$('nameSearch').addEventListener('input',render);$('year').textContent=new Date().getFullYear();render();load();
</script>
</body></html>
